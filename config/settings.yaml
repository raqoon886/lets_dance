# Let's Dance - Configuration Settings

# ── 디버그 옵션 ─────────────────────────────────────────────────────
# fake_multi: true 로 설정하면 보드 1개로 멀티플레이 UI 테스트 가능
# 테스트 후 false 로 되돌리거나 이 블록을 삭제하세요
debug:
  fake_multi: false

camera:
  device_id: 0
  width: 640
  height: 480
  fps: 30

pose:
  model_complexity: 1        # 0: Lite, 1: Full, 2: Heavy
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  enable_segmentation: false

embedding:
  model_dir: "data/models/embedding"
  model_name: "finetune_tcn_base_infonce_e64_final"   # pretrain+finetune 결과 기본값
  model_path: ""              # optional direct .tflite path; empty uses registry/model_name
  use_reference_cache: true
  reference_cache_dir: "data/cache/reference_embeddings"
  sequence_length: 30
  feature_dims: 2             # 2=xy, 3=xyz, 4=xyz+visibility
  input_layout: "BTJC"
  top_k: 3
  candidate_stride: 3
  similarity_threshold: 0  # raw cosine floor; below→0, above→stretched to [0,1]

scratch:
  model_dir: "data/models/scratch"
  model_name: "scratch_tcn_base_infonce_e64_final"
  model_path: ""              # optional direct .tflite path; empty uses registry/model_name
  use_reference_cache: true
  reference_cache_dir: "data/cache/reference_embeddings"
  sequence_length: 30
  feature_dims: 2             # 2=xy, 3=xyz, 4=xyz+visibility
  input_layout: "BTJC"        # BTJC=[1,T,J,C], BJTC=[1,J,T,C], BTC=[1,T,J*C]
  top_k: 3
  candidate_stride: 3
  similarity_threshold: 0  # raw cosine floor; below→0, above→stretched to [0,1]

scoring:
  similarity_metric: "cosine"  # cosine, euclidean, dtw
  score_scale: 1000
  combo_multiplier: 1.5
  baseline: 0               # 서 있는 자세의 기본 유사도 — raw sim에서 이 값을 빼고 0~100으로 리매핑
  missing_pose_penalty:
    enabled: true             # scoring tick에서 포즈가 없으면 Miss로 집계
    similarity: 0.0           # missing pose를 scorer에 넣을 raw similarity
    grace_seconds: 1.0        # 곡 시작 직후 카메라/모델 안정화 시간
  timing_offset_penalty:
    enabled: true             # tolerance window에서 현재 박자와 먼 후보는 감점
    max_penalty: 0.08         # tolerance window 끝 후보에 적용되는 최대 raw similarity 감점
  grade_thresholds:
    perfect: 350
    great: 250
    good: 150
    ok: 10

runtime_smoothing:
  pose_hold_frames: 6              # short pose-detection dropouts reuse the last valid pose
  score_hold_seconds: 0.3          # keep the last feedback visible briefly when no new score is produced
  model_warmup_direct_fallback: true
  fallback_similarity: "angle"     # direct fallback used while scratch/embedding windows are not ready

logging:
  score_trace:
    enabled: false
    dir: "data/logs/score_traces"  # 점수 판정 tick마다 정답/유저 스켈레톤과 similarity를 JSONL로 저장

game:
  countdown_seconds: 3
  default_mode: "practice"     # practice, challenge, freestyle
  max_song_duration: 180       # seconds

ui:
  window_width: 1024
  window_height: 540
  fullscreen: false
  theme: "neon"                # neon, minimal, retro
  show_skeleton: true
  show_reference: true
  font_size: 24

audio:
  music_volume: 0.7
  sfx_volume: 0.8
